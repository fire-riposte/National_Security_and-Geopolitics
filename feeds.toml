# Wires and general news. Reuters and AP have no public RSS feeds, so their
# stories come in through Google News searches.

[[feeds]]
name = "Google News: espionage"
google_news = "espionage OR spy OR counterintelligence when:2d"
boost = 0

[[feeds]]
name = "Google News: US intelligence"
google_news = "CIA OR NSA OR FBI OR \"intelligence community\" when:2d"
boost = 0

[[feeds]]
name = "Google News: China military"
google_news = "China (military OR PLA OR Taiwan OR hackers) when:2d"
boost = 0

[[feeds]]
name = "Google News: Russia, Iran, North Korea"
google_news = "(Russia OR Iran OR \"North Korea\") (military OR intelligence OR sanctions) when:2d"
boost = 0

