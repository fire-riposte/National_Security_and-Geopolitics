# ---------------------------------------------------------------------------
# Wires and general news. Reuters and AP have no public RSS feeds, so their
# stories come in through Google News searches. The searches use the same words
# the scoring rewards, so each is capped to leave room for the specialist
# outlets above.

[[feeds]]
name = "Google News: espionage"
google_news = "espionage OR spy OR counterintelligence -thriller -movie -film -netflix -stock when:2d"
boost = 0
max_items = 15

[[feeds]]
name = "Google News: US intelligence"
google_news = "CIA OR NSA OR FBI OR \"intelligence community\" -thriller -movie -film when:2d"
boost = 0
max_items = 15

[[feeds]]
name = "Google News: China military"
google_news = "China (military OR PLA OR Taiwan OR hackers) when:2d"
boost = 0
max_items = 15

[[feeds]]
name = "Google News: Russia, Iran, North Korea"
