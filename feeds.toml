# Sources and scoring for the NatSec Brief.
#
# scripts/fetch_feeds.py reads this file. Every domain a feed lives on must be
# in the cloud environment's allowed domains, or the fetch fails with a 403.
#
# Feed fields:
#   name         label shown in the candidate list
#   url          RSS or Atom feed URL
#   google_news  a Google News search query, used instead of url
#   boost        added to every item's score; use it for feeds that are on-topic
#                by nature, so their items survive even without keyword hits
#   max_items    keep only this many of the feed's best-scoring items per run
#   locale       Google News edition as language-COUNTRY, e.g. "de-DE";
#                defaults to "en-US"

[scoring]
min_score = 3         # items below this are dropped
max_candidates = 150  # cap on how many items the brief writer reads

# A group adds its weight once per item: the full weight for a hit in the
# headline, half for a hit only in the snippet. ALL-CAPS terms match case
# exactly (so "MSS" never matches "mss"); everything else ignores case.
# A trailing * matches any word ending ("Iran*" matches "Iranian").

[[scoring.groups]]
name = "espionage"
weight = 5
terms = [
  "espionage", "cyberespionage", "spy", "spies", "spying", "spymaster*",
  "counterintelligence", "counter-intelligence", "intelligence officer*",
  "intelligence service*", "intelligence agenc*", "foreign agent*", "FARA",
  "defector*", "defected", "mole", "insider threat", "classified information",
  "classified documents", "leaked", "leaker*", "transnational repression",
  "sabotage", "saboteur*", "Ministry of State Security", "MSS",
  "United Front", "GRU", "SVR", "FSB", "Unit 29155", "IRGC", "Quds Force",
  "MOIS", "Reconnaissance General Bureau", "Lazarus Group", "Salt Typhoon",
  "Volt Typhoon", "Flax Typhoon", "APT*", "state-sponsored hack*",
  "state-backed hack*", "hacker*", "hacked", "hacking", "surveillance",
  "undersea cable*", "security clearance*", "Havana syndrome",
  "anomalous health incident*", "influence operation*", "covert",
  # German and Israeli services
  "BND", "Bundesnachrichtendienst", "German intelligence", "Verfassungsschutz",
  "BfV", "Militärischer Abschirmdienst", "BAMAD", "Mossad", "Shin Bet",
  "Shabak", "Unit 8200", "Military Intelligence Directorate",
  "Israeli intelligence",
  # German terms, for the German-language feeds
  "Spion*", "Cyberspionage", "Agententätigkeit", "geheimdienstlich*",
  "Geheimdienst*", "Nachrichtendienst*", "Landesverrat", "Einflussoperation*",
]

[[scoring.groups]]
name = "us-ic-military"
weight = 3
terms = [
  "CIA", "NSA", "FBI", "DIA", "NGA", "NRO", "ODNI", "Director of National Intelligence",
  "intelligence community", "National Security Council", "Pentagon",
  "Department of Defense", "Defense Department", "Department of War",
  "War Department", "Secretary of Defense", "Defense Secretary",
  "Secretary of War", "War Secretary", "Joint Chiefs", "U.S. military",
  "US military", "Army", "Navy", "Air Force", "Space Force", "Marine Corps",
  "Coast Guard", "Cyber Command", "CYBERCOM", "INDOPACOM", "EUCOM", "CENTCOM",
  "SOUTHCOM", "AFRICOM", "NORTHCOM", "SOCOM", "special operations",
  "Golden Dome", "missile defense", "defense budget", "NDAA", "Section 702",
  "FISA", "Intelligence Committee", "Armed Services Committee",
]

[[scoring.groups]]
name = "adversaries"
weight = 3
terms = [
  "China", "Chinese", "Beijing", "PRC", "PLA", "People's Liberation Army",
  "CCP", "Chinese Communist Party", "Xi Jinping", "Taiwan*", "South China Sea",
  "Russia", "Russian*", "Kremlin", "Moscow", "Putin", "Iran", "Iranian*",
  "Tehran", "Khamenei", "North Korea*", "DPRK", "Pyongyang", "Kim Jong Un",
  "Hezbollah", "Houthi*", "Africa Corps",
  "Russland", "russisch*", "Kreml", "chinesisch*", "Peking", "iranisch*",
  "Nordkorea*",
]

# German and Israeli militaries, and Germany's federal prosecutor. Their
# intelligence services are in the espionage group.
[[scoring.groups]]
name = "germany-israel"
weight = 3
terms = [
  "Generalbundesanwalt", "GBA", "Bundeswehr", "German military", "German army",
  "German armed forces", "BMVg", "Bundesverteidigungsminister*", "Wehrdienst",
  "Wehrpflicht", "IDF", "Israel Defense Forces", "Israeli military",
  "Israeli army", "Israeli Air Force", "Israeli Navy",
]

[[scoring.groups]]
name = "competition"
weight = 2
terms = [
  "export control*", "sanction*", "semiconductor*", "chipmaker*", "AI chip*",
  "rare earth*", "critical mineral*", "hypersonic*", "nuclear weapon*",
  "nuclear test*", "ICBM*", "submarine*", "AUKUS", "NATO", "Five Eyes",
  "great power", "great-power", "strategic competition", "gray zone",
  "grey zone", "Belt and Road", "arms control", "New START", "Arctic",
  "anti-satellite", "satellite*", "Huawei", "Entity List", "CFIUS",
  "disinformation", "Ukrain*", "Sanktion*", "Desinformation",
  "hybride Bedrohung*",
]

# Pushes down entertainment and market stories that match "spy", "Russia" or
# "BND" (also a Vanguard bond ETF ticker).
[[scoring.groups]]
name = "noise"
weight = -8
terms = [
  "thriller*", "movie", "movies", "film", "films", "Netflix", "Prime Video",
  "Hulu", "streaming", "box office", "trailer", "TV series", "season finale",
  "actor", "actress", "novel", "novels", "video game*", "ETF", "stocks",
  "stock market", "S&P 500", "Nasdaq", "BATS", "chart image", "Vanguard",
  "bond fund*", "expense ratio",
]

[[scoring.groups]]
name = "enforcement"
weight = 1
terms = [
  "indict*", "charged", "arrested", "sentenced", "extradit*",
  "pleaded guilty", "convicted", "expelled", "expulsion",
  "Festnahme*", "festgenommen", "Anklage", "angeklagt", "Haftbefehl*",
  "verurteilt",
]

